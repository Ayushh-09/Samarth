<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login — Samarth</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:8px;">
        <div style="width:56px;height:56px;border-radius:14px;background:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:1.6rem;color:#fff;margin-bottom:12px;"></div>
      </div>
      <h1 class="auth-title">Client Portal</h1>
      <p class="auth-subtitle">Submit help requests and track volunteer assignments</p>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      </div>
      <form id="login-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="login-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Login</button>
        <div style="margin-top:16px;padding:10px;background:rgba(255,255,255,0.05);border-radius:8px;font-size:0.85rem;color:var(--text-sec);text-align:center;">
          <span>💡 Quick Login: </span>
          <button type="button" class="btn btn-sm" style="padding:2px 8px;margin:0 2px;background:rgba(255,255,255,0.1);color:#fff;" onclick="fillLogin('sita@client.com')">Sita</button>
          <button type="button" class="btn btn-sm" style="padding:2px 8px;margin:0 2px;background:rgba(255,255,255,0.1);color:#fff;" onclick="fillLogin('kiran@client.com')">Kiran NGO</button>
        </div>
      </form>
      <form id="signup-form" style="display:none" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" id="signup-name" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="signup-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="signup-password" placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">Location (City)</label>
          <input type="text" class="form-control" id="signup-location" placeholder="e.g., Mumbai" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Create Account</button>
      </form>
      <p class="auth-footer"><a href="/index.html">← Back to Home</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    if (isLoggedIn() && getUser().role === 'client') location.href = '/client.html';
    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab==='login');
      document.getElementById('tab-signup').classList.toggle('active', tab==='signup');
      document.getElementById('login-form').style.display = tab==='login'?'block':'none';
      document.getElementById('signup-form').style.display = tab==='signup'?'block':'none';
    }
    function fillLogin(email) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = 'password123';
    }
    async function handleSubmit(e) {
      e.preventDefault();
      const isSignup = e.target.id === 'signup-form';
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Please wait...';

      try {
        let result;
        if (isSignup) {
          result = await signup({
            name: document.getElementById('signup-name').value,
            email: document.getElementById('signup-email').value,
            password: document.getElementById('signup-password').value,
            role: 'client',
            location: document.getElementById('signup-location').value
          });
        } else {
          result = await login(
            document.getElementById('login-email').value,
            document.getElementById('login-password').value,
            'client'
          );
        }
        saveUser(result.user);
        showToast(result.message || 'Login successful!', 'success');
        setTimeout(() => location.href = '/client.html', 400);
      } catch (err) {
        showToast(err.message || 'Authentication failed', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    }
  </script>
</body>
</html>
