<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Samarth — Connecting people in need with skilled volunteers through intelligent matching.">
  <title>Samarth — Smart Resource Allocation</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="hero">
    <div class="hero-icon">🤝</div>
    <h1>Samarth</h1>
    <p>Connecting communities in need with skilled volunteers through intelligent matching and real-time impact tracking</p>
    <div class="hero-buttons">
      <button class="hero-btn client" onclick="location.href='/client-login.html'"> Login as Client</button>
      <button class="hero-btn volunteer" onclick="location.href='/volunteer-login.html'"> Login as Volunteer</button>
    </div>
    <div class="hero-features">
      <div class="hero-feature">✅ Smart Priority Matching</div>
      <div class="hero-feature">📊 Real-time Impact Dashboard</div>
      <div class="hero-feature">📍 Location-based Allocation</div>
      <div class="hero-feature">⚡ Instant Response Tracking</div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    if (isLoggedIn()) {
      const u = getUser();
      location.href = u.role === 'volunteer' ? '/volunteer.html' : '/client.html';
    }
  </script>
</body>
</html>
